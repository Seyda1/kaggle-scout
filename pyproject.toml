[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kaggle-scout"
version = "0.1.0"
description = "A personalized AI agent for Kaggle competition discovery and recommendations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "kaggle>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
